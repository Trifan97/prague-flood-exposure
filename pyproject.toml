[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prague-flood-exposure"
version = "0.1.0"
description = "Prague buildings exposed to river and small-stream flood zones, via a distributed spatial join in Apache Sedona / Wherobots."
readme = "README.md"
license = "MIT"
authors = [{ name = "Tudor Trifan" }]
requires-python = ">=3.11"
# Loose ranges: what the code needs. Exact tested versions live in requirements.txt.
# pyspark stays on 4.1.x because the Wherobots runtime the pipeline ran on is Spark 4.1.3
# (its release notes said 4.0; the runtime itself reported 4.1.3). Developing against
# another minor version risks code that passes here and fails on the cluster.
dependencies = [
    "apache-sedona>=1.9,<1.10",
    # Cuts the Prague buildings out of Overture's GeoParquet on S3 (download stage only).
    "duckdb>=1.1",
    # Writes the small result tables as GeoParquet (export.py); needs pyarrow for Parquet.
    "geopandas>=1.0",
    # sedona.spark imports pandas on start-up, but apache-sedona does not declare it.
    # Below 3, like the Wherobots runtime (pandas 2.2); under pandas 3, PySpark 4.0 warned
    # about arguments pandas 3 deprecates.
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "pyspark>=4.1,<4.2",
]

[project.optional-dependencies]
# The interactive maps (maps.py): kepler.gl's Python package, used through SedonaKepler.
maps = ["keplergl>=0.4,<0.5"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers turns a mistyped marker into an error instead of a silently unmarked test.
# -rs prints the reason for every skipped test, so a skip is never silent.
addopts = ["--import-mode=importlib", "--strict-markers", "-rs"]
markers = [
    "spark: starts a local Spark session and needs Java (skip with: pytest -m 'not spark')",
    "data: checks the downloaded files in data/raw; skipped until they are downloaded",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax, N: naming
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# These ship without type hints, so mypy treats their objects as untyped (Any).
module = [
    "sedona", "sedona.*", "geopandas", "geopandas.*", "pyarrow", "pyarrow.*",
    "shapely", "shapely.*", "keplergl", "keplergl.*",
]
ignore_missing_imports = true
